apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8069
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8072
  ingressClassName: nginx
